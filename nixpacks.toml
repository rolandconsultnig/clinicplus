[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.virtualenv", "nodejs_20", "npm"]

[phases.install]
cmds = [
  "npm install",
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = ". /opt/venv/bin/activate && gunicorn main:app --bind 0.0.0.0:$PORT --workers 4"
